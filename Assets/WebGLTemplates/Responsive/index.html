<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>{{{ PRODUCT_NAME }}}</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1b1d24;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#unity-canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;background:#1b1d24;outline:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f3e9d2;font:600 18px system-ui,sans-serif;gap:14px}
#bar{width:min(320px,70vw);height:10px;border-radius:5px;background:#3a3d48;overflow:hidden}
#fill{height:100%;width:0;background:#f2b84b;transition:width .2s}
#fs{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:5;width:40px;height:40px;border:0;border-radius:10px;background:rgba(20,22,28,.55);color:#fff;font-size:20px;cursor:pointer;display:none}
#fs:hover{background:rgba(20,22,28,.8)}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><div>{{{ PRODUCT_NAME }}} 載入中…</div><div id="bar"><div id="fill"></div></div></div>
<button id="fs" title="全螢幕" aria-label="全螢幕">⛶</button>
<script>
var canvas=document.getElementById("unity-canvas");
var mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&Math.min(screen.width,screen.height)<900);
if(!/[?&]touch=/.test(location.search)&&(mobile||(window.matchMedia&&matchMedia("(pointer:coarse)").matches&&!matchMedia("(any-pointer:fine)").matches))){var q=location.search?location.search+"&touch=1":"?touch=1";history.replaceState(null,"",location.pathname+q+location.hash);}
var config={
  dataUrl:"Build/{{{ DATA_FILENAME }}}",
  frameworkUrl:"Build/{{{ FRAMEWORK_FILENAME }}}",
  codeUrl:"Build/{{{ CODE_FILENAME }}}",
  streamingAssetsUrl:"StreamingAssets",
  companyName:"{{{ COMPANY_NAME }}}",productName:"{{{ PRODUCT_NAME }}}",productVersion:"{{{ PRODUCT_VERSION }}}",
  matchWebGLToCanvasSize:true,
  devicePixelRatio:Math.min(window.devicePixelRatio||1,mobile?1.5:2)
};
var s=document.createElement("script");
s.src="Build/{{{ LOADER_FILENAME }}}";
s.onload=function(){
  createUnityInstance(canvas,config,function(p){document.getElementById("fill").style.width=(100*p)+"%";}).then(function(u){
    window.unityInstance=u;document.getElementById("loading").remove();
    var fs=document.getElementById("fs");fs.style.display="block";
    fs.onclick=function(){
      var el=document.documentElement;
      if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
      else if(el.requestFullscreen){el.requestFullscreen().then(function(){if(mobile&&screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(function(){});}).catch(function(){u.SetFullscreen(1);});}
      else u.SetFullscreen(1);
      canvas.focus();
    };
  }).catch(function(m){alert(m);});
};
document.body.appendChild(s);
document.addEventListener("contextmenu",function(e){e.preventDefault();});
</script>
</body>
</html>
